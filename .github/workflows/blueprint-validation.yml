name: Blueprint Validation

# SECURITY MODEL (read before editing)
# - Runs on `pull_request`, so fork PRs get a read-only token and no secrets.
#   Do NOT switch this to `pull_request_target` or add secrets/write scopes:
#   this job processes untrusted pull-request content.
# - The validator that enforces the rules always comes from the PR's BASE
#   commit (`trusted/`). The PR head (`pr/`) is checked out as DATA ONLY and
#   no code from it is executed.
# - Changed paths are enumerated NUL-delimited and handed to the validator as
#   argv elements. They are never expanded into shell source, `$GITHUB_OUTPUT`
#   or `${{ }}` expressions, so any legal Git path is handled as plain data.
# - Third-party actions are pinned to the commit SHA of the release tag noted
#   beside each `uses:`.

on:
  pull_request:
    paths:
      - 'blueprints/**.json'
      - 'blueprints/**.yml'
      - 'blueprints/**.yaml'
      - '.github/scripts/validate_blueprints.py'

permissions:
  contents: read

jobs:
  validate-blueprints:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted validator (PR base revision)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Checkout PR blueprints (untrusted, data only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pyyaml==6.0.3

      - name: Find changed blueprint files
        id: find_blueprint_files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          export LC_ALL=C
          cd pr

          # The merge-base diff needs the base commit; fetch it if it is missing.
          git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            || git fetch --no-tags --quiet origin "$BASE_SHA"

          # NUL-delimited (-z): no quoting/escaping of unusual names. A failure
          # here fails the step instead of silently skipping validation.
          git diff -z --name-only "${BASE_SHA}...${HEAD_SHA}" > "$RUNNER_TEMP/changed_paths.nul"

          : > "$RUNNER_TEMP/blueprint_files.nul"
          count=0
          while IFS= read -r -d '' path; do
            case "$path" in
              blueprints/*.json|blueprints/*.yml|blueprints/*.yaml) ;;
              *) continue ;;
            esac
            # Newlines and other control characters cannot appear in a real
            # blueprint path and would let a name forge log lines. Fail closed.
            if [[ "$path" == *[[:cntrl:]]* ]]; then
              printf '::error::Refusing blueprint path containing control characters: %q\n' "$path"
              exit 1
            fi
            printf '%s\0' "$path" >> "$RUNNER_TEMP/blueprint_files.nul"
            count=$((count + 1))
          done < "$RUNNER_TEMP/changed_paths.nul"

          if [ "$count" -eq 0 ]; then
            echo "No blueprint files changed in this PR."
            echo "has_blueprints=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed blueprint files ($count):"
            while IFS= read -r -d '' path; do
              printf '  %q\n' "$path"
            done < "$RUNNER_TEMP/blueprint_files.nul"
            echo "has_blueprints=true" >> "$GITHUB_OUTPUT"
          fi
        shell: bash

      - name: Validate blueprint files
        if: steps.find_blueprint_files.outputs.has_blueprints == 'true'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          echo "🔍 Validating blueprints for PR author: $PR_AUTHOR"
          mapfile -d '' -t blueprint_files < "$RUNNER_TEMP/blueprint_files.nul"
          cd pr
          # -I: isolated mode (no cwd/script-dir on sys.path, ignores PYTHON* env),
          # so nothing in the PR checkout can shadow a module. The validator is the
          # base-revision copy; the PR files are only read as input data.
          python -I "$GITHUB_WORKSPACE/trusted/.github/scripts/validate_blueprints.py" \
            --pr-author "$PR_AUTHOR" \
            -- "${blueprint_files[@]}"
        shell: bash

      - name: Post validation summary
        if: always() && steps.find_blueprint_files.outputs.has_blueprints == 'true'
        run: |
          echo "::notice::Blueprint validation completed. Check the logs above for details."
          echo "::notice::Next step: If validation passed, the webhook will trigger a cost-controlled evaluation."
